services:
  - type: web
    name: data-engineer-django
    env: docker
    dockerContext: ./application
    dockerfilePath: ./application/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: data-engineer-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: data-engineer-db
    plan: free
    databaseName: django_db
