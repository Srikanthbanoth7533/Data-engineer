{% extends 'base.html' %}
{% block content %}

<div style="padding: 40px; color: white; font-family: 'Oswald', sans-serif;">
    <h1 style="font-size: 2.5rem; margin-bottom: 30px;">👤 Meu Perfil</h1>
    <div style="display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: start;">
        <div style="background: #20162c; border-radius: 12px; padding: 24px; text-align: center; border: 1px solid #6c4896;">
            <div style="width: 100px; height: 100px; background: #6c4896; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">👤</div>
            <h2 style="margin: 0; font-size: 1.4rem;">Aluno</h2>
            <p style="color: #aaa; margin: 4px 0;">Data Engineer</p>
        </div>
        <div style="background: #20162c; border-radius: 12px; padding: 24px; border: 1px solid #6c4896;">
            <h2 style="color: #ec6f09; margin-top: 0;">Informações</h2>
            <table style="width: 100%; border-collapse: collapse;">
                <tr style="border-bottom: 1px solid #333;">
                    <td style="padding: 12px 0; color: #aaa; width: 160px;">Nome</td>
                    <td style="padding: 12px 0;">—</td>
                </tr>
                <tr style="border-bottom: 1px solid #333;">
                    <td style="padding: 12px 0; color: #aaa;">E-mail</td>
                    <td style="padding: 12px 0;">—</td>
                </tr>
                <tr style="border-bottom: 1px solid #333;">
                    <td style="padding: 12px 0; color: #aaa;">Formação</td>
                    <td style="padding: 12px 0;">—</td>
                </tr>
                <tr>
                    <td style="padding: 12px 0; color: #aaa;">Membro desde</td>
                    <td style="padding: 12px 0;">—</td>
                </tr>
            </table>
            <a href="{% url 'login' %}" style="display: inline-block; margin-top: 20px; background: #6c4896; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none;">Fazer Login</a>
        </div>
    </div>
</div>

{% endblock %}
